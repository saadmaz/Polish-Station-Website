name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by a Sanity webhook (Settings > API > Webhooks in sanity.io/manage)
  # on every publish/unpublish, so a new blog post goes live without anyone
  # having to push a commit or click "Run workflow" manually. The webhook
  # POSTs to https://api.github.com/repos/<owner>/<repo>/dispatches with
  # body {"event_type": "sanity-publish"} and an Authorization header
  # carrying a GitHub PAT (repo scope) - see studio/README.md.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: write

# A single Sanity publish can fire several webhook deliveries in the same
# few seconds (one per underlying document mutation), each triggering its
# own run here - without this, they race to force-push the same `deploy`
# branch and GitHub's ref-lock rejects all but one as a hard failure.
# Queuing them and cancelling superseded ones is safe: every queued run
# builds from the same `main`, so only the newest one actually needs to run.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          VITE_SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          VITE_SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          VITE_POS_API_BASE_URL: https://pos.polishstation.lk
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: bun run build

      - name: Add cPanel deploy file
        run: cp .cpanel.yml dist/client/.cpanel.yml

      - name: Push built site to deploy branch
        run: |
          cd dist/client
          git init -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

      - name: Trigger cPanel pull & deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ZIRCON_SSH_HOST }}
          port: ${{ secrets.ZIRCON_SSH_PORT }}
          username: ${{ secrets.ZIRCON_SSH_USER }}
          key: ${{ secrets.ZIRCON_SSH_KEY }}
          script: |
            set -e
            REPO=$HOME/repositories/polish-station
            git -C "$REPO" fetch origin
            git -C "$REPO" checkout deploy
            git -C "$REPO" reset --hard origin/deploy

            # The deployment task runs in cPanel's background task queue, and
            # its process gets killed once this SSH session closes (jailshell
            # doesn't let it linger past the session). So wait here and
            # confirm it actually finished before disconnecting.
            OUT=$(uapi --output=jsonpretty VersionControlDeployment create repository_root="$REPO")
            LOG=$(echo "$OUT" | grep -o '"log_path" : "[^"]*"' | sed 's/.*: "\(.*\)"/\1/')
            for i in $(seq 1 30); do
              if grep -q "Build completed" "$LOG" 2>/dev/null; then
                cat "$LOG"
                exit 0
              fi
              sleep 1
            done
            echo "Timed out waiting for deployment to finish"
            cat "$LOG" 2>/dev/null
            exit 1
