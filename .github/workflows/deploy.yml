# Builds the prerendered site and deploys it to Cloudflare Workers.
# main deploys to production once the CLOUDFLARE_ENABLED
# repository variable is "true"; develop deploys to development once
# DEVELOPMENT_ENABLED is "true". Needs the CLOUDFLARE_API_TOKEN secret and the
# CLOUDFLARE_ACCOUNT_ID variable (see docs/DEPLOYMENT.md).
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.ref_name == 'main' && vars.CLOUDFLARE_ENABLED == 'true') ||
      (github.ref_name == 'develop' && vars.DEVELOPMENT_ENABLED == 'true')
    name: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: ${{ vars.APP_URL }}
    env:
      APP_URL: ${{ vars.APP_URL }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_OS_API_BASE_URL: ${{ vars.OS_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy ${{ github.ref_name == 'develop' && '--env development' || '' }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -D headers.txt -w "%{http_code}" --max-time 30 -L "$APP_URL/" || echo 000)
            echo "$APP_URL -> $code"
            [ "$code" = "200" ] && exit 0
            if [ "$code" = "403" ] && grep -qi '^cf-mitigated: challenge' headers.txt; then
              echo "::notice::$APP_URL is up (Cloudflare challenged the CI runner)"
              exit 0
            fi
            sleep 15
          done
          cat headers.txt
          echo "::error::$APP_URL did not return 200"
          exit 1
