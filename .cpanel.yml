---
# cPanel deployment file. This runs on the Zircon server whenever the
# "deploy" branch is pulled + deployed via cPanel > Git Version Control.
# It syncs the built site (the deploy branch contents) into public_html.
deployment:
  tasks:
    - /usr/bin/rsync -a --delete --exclude=.git --exclude=.cpanel.yml --exclude=.well-known --exclude=cgi-bin ./ $HOME/public_html/
